<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Wealth Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #27ae60;
            --expense-color: #e74c3c;
            --bond-color: #f39c12;
        }

        body {
            background: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            margin-bottom: 1.5rem;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .income-section { border-left: 4px solid var(--accent-color); }
        .realestate-section { border-left: 4px solid #8e44ad; }
        .equity-section { border-left: 4px solid var(--secondary-color); }
        .fno-section { border-left: 4px solid #34495e; }
        .bond-section { border-left: 4px solid var(--bond-color); }
        .expense-section { border-left: 4px solid var(--expense-color); }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        #netWorthChart {
            max-height: 400px;
        }

        .summary-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4 text-center">🇮🇳 Personal Wealth Dashboard</h1>
        
        <div class="row g-4">
            <!-- Income Column -->
            <div class="col-md-4">
                <div class="dashboard-card p-4 income-section">
                    <h4>Regular Income</h4>
                    <div class="mb-3">
                        <label>Monthly Salary (₹)</label>
                        <input type="number" class="form-control" id="salary">
                    </div>
                    <div class="mb-3">
                        <label>Bonus/Stocks (Annual ₹)</label>
                        <input type="number" class="form-control" id="bonus">
                    </div>
                    <div class="mb-3">
                        <label>Freelance Income (Monthly ₹)</label>
                        <input type="number" class="form-control" id="freelance">
                    </div>
                </div>

                <div class="dashboard-card p-4 realestate-section">
                    <h4>Real Estate</h4>
                    <div class="mb-3">
                        <label>Property Value (₹)</label>
                        <input type="number" class="form-control" id="propertyValue">
                    </div>
                    <div class="mb-3">
                        <label>Rental Income (Monthly ₹)</label>
                        <input type="number" class="form-control" id="rentalIncome">
                    </div>
                </div>
            </div>

            <!-- Investments Column -->
            <div class="col-md-4">
                <div class="dashboard-card p-4 equity-section">
                    <h4>Equity Investments</h4>
                    <div class="mb-3">
                        <label>Stocks/MFs Value (₹)</label>
                        <input type="number" class="form-control" id="equityValue">
                    </div>
                    <div class="mb-3">
                        <label>Dividend Income (Annual ₹)</label>
                        <input type="number" class="form-control" id="dividends">
                    </div>
                </div>

                <div class="dashboard-card p-4 bond-section">
                    <h4>Bond Investments</h4>
                    <div class="mb-3">
                        <label>Bond Portfolio Value (₹)</label>
                        <input type="number" class="form-control" id="bondValue">
                    </div>
                    <div class="mb-3">
                        <label>Annual Coupon Income (₹)</label>
                        <input type="number" class="form-control" id="couponIncome">
                    </div>
                </div>
            </div>

            <!-- Expenses & F&O Column -->
            <div class="col-md-4">
                <div class="dashboard-card p-4 fno-section">
                    <h4>F&O Trading</h4>
                    <div class="mb-3">
                        <label>Monthly P&L (₹)</label>
                        <input type="number" class="form-control" id="fnoProfit">
                    </div>
                    <div class="mb-3">
                        <label>Margin Used (₹)</label>
                        <input type="number" class="form-control" id="marginUsed">
                    </div>
                </div>

                <div class="dashboard-card p-4 expense-section">
                    <h4>Monthly Expenses</h4>
                    <div class="mb-3">
                        <label>Rent/EMI (₹)</label>
                        <input type="number" class="form-control" id="rentEmi">
                    </div>
                    <div class="mb-3">
                        <label>Utilities (₹)</label>
                        <input type="number" class="form-control" id="utilities">
                    </div>
                    <div class="mb-3">
                        <label>Living Expenses (₹)</label>
                        <input type="number" class="form-control" id="livingExpenses">
                    </div>
                </div>
            </div>
        </div>

        <!-- Financial Summary -->
        <div class="dashboard-card p-4">
            <h4 class="text-center mb-4">Financial Summary</h4>
            <div class="row text-center">
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Monthly Income</h6>
                        <h4 id="monthlyIncome">₹0</h4>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Yearly Income</h6>
                        <h4 id="yearlyIncome">₹0</h4>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Monthly Expenses</h6>
                        <h4 id="monthlyExpenses">₹0</h4>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Net Savings</h6>
                        <h4 id="netSavings">₹0</h4>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Total Assets</h6>
                        <h4 id="totalAssets">₹0</h4>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="summary-box">
                        <h6>Net Worth</h6>
                        <h4 id="netWorth">₹0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="dashboard-card p-4 mt-4">
            <canvas id="netWorthChart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Auto-save functionality
        document.querySelectorAll('input').forEach(input => {
            input.value = localStorage.getItem(input.id) || '';
            input.addEventListener('input', () => {
                localStorage.setItem(input.id, input.value);
                calculateFinances();
            });
        });

        // Financial Calculations
        function calculateFinances() {
            // Income Sources
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const bonus = parseFloat(document.getElementById('bonus').value) || 0;
            const freelance = parseFloat(document.getElementById('freelance').value) || 0;
            const rental = parseFloat(document.getElementById('rentalIncome').value) || 0;
            const fnoProfit = parseFloat(document.getElementById('fnoProfit').value) || 0;
            const dividends = parseFloat(document.getElementById('dividends').value) || 0;
            const couponIncome = parseFloat(document.getElementById('couponIncome').value) || 0;

            // Assets & Investments
            const propertyValue = parseFloat(document.getElementById('propertyValue').value) || 0;
            const equityValue = parseFloat(document.getElementById('equityValue').value) || 0;
            const bondValue = parseFloat(document.getElementById('bondValue').value) || 0;
            const marginUsed = parseFloat(document.getElementById('marginUsed').value) || 0;

            // Expenses
            const rentEmi = parseFloat(document.getElementById('rentEmi').value) || 0;
            const utilities = parseFloat(document.getElementById('utilities').value) || 0;
            const livingExpenses = parseFloat(document.getElementById('livingExpenses').value) || 0;

            // Calculations
            const monthlyIncome = salary + freelance + rental + (fnoProfit || 0);
            const yearlyIncome = (monthlyIncome * 12) + bonus + dividends + couponIncome;
            const monthlyExpenses = rentEmi + utilities + livingExpenses;
            const netSavings = monthlyIncome - monthlyExpenses;
            const totalAssets = propertyValue + equityValue + bondValue - marginUsed;
            const netWorth = totalAssets + (netSavings * 3); // 3 months liquidity buffer

            // Update Display
            document.getElementById('monthlyIncome').textContent = `₹${monthlyIncome.toLocaleString('en-IN')}`;
            document.getElementById('yearlyIncome').textContent = `₹${yearlyIncome.toLocaleString('en-IN')}`;
            document.getElementById('monthlyExpenses').textContent = `₹${monthlyExpenses.toLocaleString('en-IN')}`;
            document.getElementById('netSavings').textContent = `₹${netSavings.toLocaleString('en-IN')}`;
            document.getElementById('totalAssets').textContent = `₹${totalAssets.toLocaleString('en-IN')}`;
            document.getElementById('netWorth').textContent = `₹${netWorth.toLocaleString('en-IN')}`;

            updateChart([monthlyIncome, yearlyIncome, monthlyExpenses, netSavings, totalAssets, netWorth]);
        }

        // Chart Configuration
        const ctx = document.getElementById('netWorthChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Monthly Income', 'Yearly Income', 'Expenses', 'Savings', 'Assets', 'Net Worth'],
                datasets: [{
                    label: 'Amount in ₹',
                    data: [0, 0, 0, 0, 0, 0],
                    backgroundColor: [
                        '#2ecc71', '#27ae60', 
                        '#e74c3c', '#3498db', 
                        '#8e44ad', '#2c3e50'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => `₹${context.raw.toLocaleString('en-IN')}`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: (value) => `₹${value.toLocaleString('en-IN')}`
                        }
                    }
                }
            }
        });

        function updateChart(data) {
            chart.data.datasets[0].data = data;
            chart.update();
        }

        // Initial calculation
        calculateFinances();
    </script>
</body>
</html>
